name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tai ScriptHookVDotNet nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lib shv
          gh release download -R scripthookvdotnet/scripthookvdotnet-nightly --pattern "*.zip" --dir shv
          for z in shv/*.zip; do unzip -o "$z" -d shv/x; done
          cp "$(find shv/x -name ScriptHookVDotNet3.dll | head -1)" lib/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build tat ca script
        run: |
          mkdir -p out
          rm -f failed.txt
          for p in *.csproj; do
            rm -rf obj bin
            dotnet build "$p" -c Release -o out || echo "$p" >> failed.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RainOnScreen
          path: out/*.dll
      - name: Bao loi neu co script khong bien dich duoc
        run: |
          if [ -f failed.txt ]; then echo "SCRIPT LOI:"; cat failed.txt; exit 1; fi
